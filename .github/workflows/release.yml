name: Release & Build Application Executables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-windows:
    needs: release-please
    if: |
      !failure() && !cancelled() &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Sync package.json version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing package.json version to $TAG_VERSION from tag $GITHUB_REF_NAME"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Package Windows (Installer & Portable)
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    needs: release-please
    if: |
      !failure() && !cancelled() &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Sync package.json version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing package.json version to $TAG_VERSION from tag $GITHUB_REF_NAME"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Package Linux AppImage
        run: npx electron-builder --linux AppImage --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: release/*.AppImage
          if-no-files-found: error

  publish-release:
    needs: [release-please, build-windows, build-linux]
    if: |
      !failure() && !cancelled() &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: release-tag
        shell: bash
        run: |
          if [ -n "${{ needs.release-please.outputs.tag_name }}" ]; then
            echo "tag=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: |
            release-assets/*.exe
            release-assets/*.AppImage
          generate_release_notes: ${{ needs.release-please.outputs.release_created != 'true' }}
          draft: false
          prerelease: false

      - name: Sync version back to main branch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('fs');
            const file = '.release-please-manifest.json';
            if (fs.existsSync(file)) {
              const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
              manifest['.'] = '$TAG_VERSION';
              fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
            }
          "
          git add package.json .release-please-manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync package version to $TAG_VERSION [skip ci]" && git push origin main)
