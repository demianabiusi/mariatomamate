<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient (Rich Deep Slate Navy) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Squircle Border with Emerald Highlights -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Top Soft Light Sheen on App Badge -->
    <linearGradient id="topSheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Warm Emerald Glow behind Mate -->
    <radialGradient id="emeraldAura" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Mate Gourd (Calabaza) - Warm caramel, chestnut & amber leather -->
    <radialGradient id="mateGourdGrad" cx="35%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="20%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="80%" stop-color="#5c2609"/>
      <stop offset="100%" stop-color="#2d1305"/>
    </radialGradient>

    <linearGradient id="mateShadowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%" stop-color="#1f0902" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0c0401" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Silver Virola (Metal Rim) -->
    <linearGradient id="silverRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="18%" stop-color="#f8fafc"/>
      <stop offset="42%" stop-color="#cbd5e1"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="innerRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Yerba Mate -->
    <radialGradient id="yerbaGrad" cx="42%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="35%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>

    <!-- Bombilla (Straw) Silver & Steel Tube -->
    <linearGradient id="bombillaTubeGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Bombilla Gold Accents (Pico de oro) -->
    <linearGradient id="goldMouthpiece" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Database Cylinders Gradient -->
    <linearGradient id="dbCylinderSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="25%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#34d399"/>
      <stop offset="85%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <linearGradient id="dbCylinderTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- MariaDB Dolphin Gradient -->
    <linearGradient id="dolphinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="mateShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. BASE SQUIRCLE TILE -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#topSheen)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- 2. AMBIENT EMERALD GLOW -->
  <circle cx="256" cy="300" r="175" fill="url(#emeraldAura)"/>

  <!-- 3. DATABASE BASE (3 SOLID CYLINDRICAL DISCS) -->
  <g id="databaseBase" transform="translate(166, 382)" filter="url(#mateShadow)">
    <!-- Layer 1: Bottom Disc -->
    <path d="M 0 45 C 0 60, 180 60, 180 45 L 180 62 C 180 77, 0 77, 0 62 Z" fill="#047857"/>
    <ellipse cx="90" cy="45" rx="90" ry="20" fill="url(#dbCylinderSide)"/>
    <ellipse cx="90" cy="45" rx="86" ry="17" fill="#065f46"/>

    <!-- Layer 2: Middle Disc -->
    <path d="M 12 24 C 12 38, 168 38, 168 24 L 168 40 C 168 54, 12 54, 12 40 Z" fill="#059669"/>
    <ellipse cx="90" cy="24" rx="78" ry="17" fill="url(#dbCylinderSide)"/>
    <ellipse cx="90" cy="24" rx="74" ry="14" fill="#047857"/>

    <!-- Layer 3: Top Disc -->
    <path d="M 22 5 C 22 18, 158 18, 158 5 L 158 20 C 158 33, 22 33, 22 20 Z" fill="#10b981"/>
    <ellipse cx="90" cy="5" rx="68" ry="15" fill="url(#dbCylinderTop)"/>
    
    <!-- Disc Specular Highlights -->
    <path d="M 30 25 C 55 35, 125 35, 150 25" fill="none" stroke="#a7f3d0" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>
    <path d="M 20 46 C 45 56, 135 56, 160 46" fill="none" stroke="#a7f3d0" stroke-width="2.5" opacity="0.45" stroke-linecap="round"/>
  </g>

  <!-- 4. BOMBILLA (STRAW) -->
  <g id="bombilla" filter="url(#mateShadow)">
    <!-- Straw Body Tube -->
    <path d="M 342 62 L 372 88 L 254 260 L 230 240 Z" fill="url(#bombillaTubeGrad)"/>
    
    <!-- Tube Specular Reflection -->
    <path d="M 350 70 L 368 85 L 254 250 L 244 242 Z" fill="#ffffff" opacity="0.75"/>
    <path d="M 342 62 L 348 68 L 238 245 L 230 240 Z" fill="#334155" opacity="0.45"/>

    <!-- Decorative Gold Cooling Rings -->
    <rect x="320" y="96" width="20" height="8" rx="3" transform="rotate(40 320 96)" fill="url(#goldMouthpiece)"/>
    <rect x="304" y="116" width="20" height="8" rx="3" transform="rotate(40 304 116)" fill="url(#goldMouthpiece)"/>

    <!-- Gold Mouthpiece (Pico de oro) -->
    <path d="M 338 58 L 364 36 C 372 29, 386 42, 378 50 L 356 72 Z" fill="url(#goldMouthpiece)" stroke="#b45309" stroke-width="1.5"/>
    <path d="M 350 48 L 368 34 C 372 31, 378 38, 374 43 L 360 58 Z" fill="#fef9c3" opacity="0.85"/>
  </g>

  <!-- 5. MATE GOURD (CALABAZA / PORONGO) -->
  <g id="mateCup" filter="url(#mateShadow)">
    <!-- Solid Warm Gourd Body -->
    <path d="M 152 208 
             C 92 242, 85 352, 134 410 
             C 174 458, 338 458, 378 410 
             C 427 352, 420 242, 360 208 
             Z" 
          fill="url(#mateGourdGrad)"/>

    <!-- Bottom Deep Shadow Overlay -->
    <path d="M 152 208 
             C 92 242, 85 352, 134 410 
             C 174 458, 338 458, 378 410 
             C 427 352, 420 242, 360 208 
             Z" 
          fill="url(#mateShadowGrad)"/>

    <!-- Warm 3D Volume Light Edge -->
    <path d="M 145 240 
             C 114 275, 116 342, 148 388 
             C 166 414, 196 430, 235 438 
             C 190 426, 158 396, 140 360 
             C 124 322, 126 270, 154 235 Z" 
          fill="#fde68a" 
          opacity="0.3"/>

    <!-- Glossy Specular Sheen (Curved Highlight) -->
    <ellipse cx="196" cy="300" rx="38" ry="68" transform="rotate(-22 196 300)" fill="#ffffff" opacity="0.14"/>
    <ellipse cx="186" cy="285" rx="18" ry="38" transform="rotate(-22 186 285)" fill="#ffffff" opacity="0.25"/>

    <!-- MariaDB / MySQL Dolphin Logo Emblem embossed in Turquoise & Gold -->
    <g transform="translate(228, 280) scale(1.15)" filter="url(#softGlow)">
      <!-- Dolphin silhouette leaping -->
      <path d="M 12 36 
               C 18 19, 38 15, 52 24 
               C 61 30, 67 42, 63 53 
               C 57 62, 45 66, 34 63 
               C 25 60, 20 52, 22 47 
               C 24 42, 30 42, 33 45 
               C 36 47, 40 47, 43 45 
               C 47 40, 45 31, 37 29 
               C 28 27, 19 32, 14 38 
               Z" 
            fill="#34d399"/>
      <!-- Fins & Tail -->
      <polygon points="50,20 57,9 62,23" fill="#6ee7b7"/>
      <polygon points="10,40 1,44 6,33" fill="#6ee7b7"/>
      <!-- Eye -->
      <circle cx="52" cy="28" r="2.5" fill="#064e3b"/>
      <circle cx="52.6" cy="27.4" r="0.8" fill="#ffffff"/>
    </g>
  </g>

  <!-- 6. POLISHED SILVER VIROLA (TOP RIM) -->
  <g id="virola">
    <!-- Outer Rim Bevel -->
    <ellipse cx="256" cy="208" rx="114" ry="38" fill="url(#silverRimGrad)" stroke="#334155" stroke-width="2"/>
    
    <!-- Outer Rim Chrome Highlight Line -->
    <ellipse cx="256" cy="206" rx="110" ry="35" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.85"/>
    
    <!-- Inner Rim Collar -->
    <ellipse cx="256" cy="209" rx="94" ry="29" fill="url(#innerRimGrad)"/>
    <ellipse cx="256" cy="210" rx="90" ry="26" fill="#09131f"/>

    <!-- Traditional Argentine Engraved Chiseled Cuts on Virola -->
    <g stroke="#64748b" stroke-width="1.8" opacity="0.55" stroke-linecap="round">
      <line x1="164" y1="202" x2="175" y2="215"/>
      <line x1="186" y1="208" x2="195" y2="223"/>
      <line x1="212" y1="214" x2="218" y2="230"/>
      <line x1="294" y1="214" x2="288" y2="230"/>
      <line x1="320" y1="208" x2="311" y2="223"/>
      <line x1="342" y1="202" x2="331" y2="215"/>
    </g>
  </g>

  <!-- 7. YERBA MATE & FOAM (ESPUMITA) -->
  <g id="yerba">
    <!-- Yerba Bed -->
    <ellipse cx="256" cy="210" rx="86" ry="24" fill="url(#yerbaGrad)"/>

    <!-- Slanted Mound Shadow (Montañita) -->
    <path d="M 174 212 C 206 230, 296 228, 338 208 C 304 225, 216 228, 174 212 Z" fill="#092813" opacity="0.75"/>

    <!-- Yerba Leaves Texture -->
    <ellipse cx="222" cy="209" rx="7" ry="3.5" fill="#15803d" transform="rotate(-15 222 209)"/>
    <ellipse cx="238" cy="214" rx="8" ry="4" fill="#166534" transform="rotate(25 238 214)"/>
    <ellipse cx="272" cy="212" rx="7" ry="3.5" fill="#14532d" transform="rotate(-30 272 212)"/>
    <ellipse cx="294" cy="208" rx="6" ry="3" fill="#166534" transform="rotate(10 294 208)"/>

    <ellipse cx="210" cy="208" rx="6" ry="3" fill="#4ade80" opacity="0.85"/>
    <ellipse cx="250" cy="207" rx="7" ry="3.5" fill="#86efac" opacity="0.75"/>
    <ellipse cx="282" cy="210" rx="6" ry="3" fill="#4ade80" opacity="0.9"/>

    <!-- Fresh Bubbling Foam (Espuma) -->
    <circle cx="228" cy="215" r="5" fill="#bbf7d0" opacity="0.9"/>
    <circle cx="237" cy="218" r="4" fill="#dcfce7" opacity="0.95"/>
    <circle cx="245" cy="216" r="4.5" fill="#86efac" opacity="0.85"/>
    <circle cx="255" cy="218" r="3.5" fill="#dcfce7" opacity="0.95"/>
    <circle cx="264" cy="216" r="4.5" fill="#bbf7d0" opacity="0.9"/>
    <circle cx="274" cy="217" r="3.5" fill="#86efac" opacity="0.8"/>
  </g>

  <!-- 8. AROMA / STEAM WISPS (Teal & Emerald) -->
  <g opacity="0.75" filter="url(#softGlow)">
    <path d="M 226 175 C 210 142, 238 115, 224 82" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <path d="M 264 165 C 280 135, 258 108, 274 76" fill="none" stroke="#6ee7b7" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>